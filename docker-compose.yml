version: "3.9"

services:
  php: 
    links:
      - mysql
    build: 
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: polis_test_php
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - polis_test_network

  nginx:
    image: nginx:alpine
    container_name: polis_test_nginx
    ports:
      - "${APP_PORT}:80"
    volumes:
      - .:/var/www/polis_test
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - node
    networks:
      - polis_test_network
    
  mysql:
    image: mysql:8.0
    container_name: polis_test_mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_TCP_PORT: ${DB_PORT}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    networks:
      - polis_test_network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping --user=${DB_USERNAME} --password=${DB_PASSWORD} --silent" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  node:
    image: node:20-alpine
    container_name: polis_test_node
    working_dir: /var/www/polis_test
    volumes:
      - .:/var/www/polis_test
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - polis_test_network

volumes:
  mysql_data:

networks:
  polis_test_network:
    driver: bridge
